[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort, W: pycodestyle warnings
# UP: pyupgrade, B: flake8-bugbear, SIM: flake8-simplify
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"